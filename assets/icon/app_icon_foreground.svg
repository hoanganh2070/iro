<rect x="202" y="368" width="116" height="50" rx="8" fill="url(#vf)"/>
<path d="M210 376 H260 L240 410 H210 Z" fill="#fff" fill-opacity="0.12"/>
<rect x="346" y="374" width="56" height="38" rx="9" fill="#0b0b0b"/>
<rect x="351" y="379" width="46" height="28" rx="6" fill="url(#vf)"/>
<circle cx="446" cy="393" r="9" fill="#E02A1F"/>
<circle cx="443" cy="390" r="3" fill="#fff" fill-opacity="0.6"/>

<!-- lens -->
<circle cx="512" cy="584" r="198" fill="#000" fill-opacity="0.55"/>
<circle cx="512" cy="584" r="186" fill="url(#silverD)"/>
<circle cx="512" cy="584" r="176" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="14" stroke-dasharray="2.2 6.8"/>
<circle cx="512" cy="584" r="162" fill="#0A0A0B"/>
<circle cx="512" cy="584" r="150" fill="none" stroke="url(#silverD)" stroke-width="6"/>
<circle cx="512" cy="584" r="140" fill="url(#glass)"/>
<circle cx="512" cy="584" r="104" fill="url(#glass2)"/>
<circle cx="512" cy="584" r="104" fill="none" stroke="#E02A1F" stroke-width="4" stroke-opacity="0.9"/>
<circle cx="512" cy="584" r="72" fill="#04060B"/>
<circle cx="512" cy="584" r="72" fill="none" stroke="#5B7FC0" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="512" cy="584" r="34" fill="#0B1226"/>
<!-- reflections -->
<path d="M418 520 A122 122 0 0 1 520 462" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="578" cy="650" rx="26" ry="14" transform="rotate(-35 578 650)" fill="#9DB8FF" fill-opacity="0.35"/>
<circle cx="470" cy="548" r="9" fill="#fff" fill-opacity="0.7"/>

<!-- small red dot on the body -->
<circle cx="214" cy="500" r="11" fill="url(#redBtn)"/>
<circle cx="211" cy="497" r="3.5" fill="#fff" fill-opacity="0.6"/>
</g></svg>