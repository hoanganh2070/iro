<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><g transform="translate(512 512) scale(0.74) translate(-512 -540)">
<defs>
  <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FAFAFC"/><stop offset="0.45" stop-color="#C9C9CF"/>
    <stop offset="0.55" stop-color="#E4E4E8"/><stop offset="1" stop-color="#8C8C92"/>
  </linearGradient>
  <linearGradient id="silverD" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F4F4F6"/><stop offset="0.5" stop-color="#8E8E94"/><stop offset="1" stop-color="#D8D8DC"/>
  </linearGradient>
  <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2C2C2E"/><stop offset="1" stop-color="#0D0D0E"/>
  </linearGradient>
  <radialGradient id="glass" cx="0.4" cy="0.35" r="0.8">
    <stop offset="0" stop-color="#3E5A8C"/><stop offset="0.45" stop-color="#16233D"/><stop offset="1" stop-color="#05070C"/>
  </radialGradient>
  <radialGradient id="glass2" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#0A0F1C"/><stop offset="0.7" stop-color="#1B1030"/><stop offset="1" stop-color="#2A1A4A"/>
  </radialGradient>
  <radialGradient id="redBtn" cx="0.35" cy="0.3" r="0.9">
    <stop offset="0" stop-color="#FF6A5A"/><stop offset="0.5" stop-color="#E02A1F"/><stop offset="1" stop-color="#7A0C08"/>
  </radialGradient>
  <linearGradient id="vf" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2A3B55"/><stop offset="1" stop-color="#0A0F18"/>
  </linearGradient>
  <pattern id="grain" width="10" height="10" patternUnits="userSpaceOnUse">
    <circle cx="2.5" cy="2.5" r="1.1" fill="#fff" fill-opacity="0.05"/>
    <circle cx="7.5" cy="7.5" r="1.1" fill="#fff" fill-opacity="0.05"/>
  </pattern>
  <pattern id="knurl" width="8" height="10" patternUnits="userSpaceOnUse">
    <rect width="3" height="10" fill="#000" fill-opacity="0.35"/>
  </pattern>
</defs>

<!-- soft ground shadow -->
<ellipse cx="512" cy="824" rx="340" ry="26" fill="#000" fill-opacity="0.55"/>

<!-- shutter-speed dial + red shutter button (behind top plate) -->
<rect x="590" y="296" width="130" height="50" rx="9" fill="url(#silver)"/>
<rect x="590" y="296" width="130" height="50" rx="9" fill="url(#knurl)"/>
<rect x="590" y="296" width="130" height="50" rx="9" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="800" cy="322" r="34" fill="url(#silverD)"/>
<circle cx="800" cy="322" r="27" fill="#101010"/>
<circle cx="800" cy="322" r="22" fill="url(#redBtn)"/>
<path d="M786 314 A18 18 0 0 1 806 306" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>

<!-- leatherette lower body -->
<rect x="152" y="410" width="720" height="384" rx="50" fill="url(#leather)"/>
<rect x="152" y="410" width="720" height="384" rx="50" fill="url(#grain)"/>
<rect x="152" y="410" width="720" height="384" rx="50" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>

