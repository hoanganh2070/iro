name: iro
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  camera: ^0.12.2
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  gal: ^2.3.3
  image: ^4.12.0
  path_provider: ^2.1.6
  saver_gallery: ^5.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0


flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B0B0B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/luts/
    - assets/images/

  shaders:
    - assets/shaders/lut.frag